<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLACEHOLDER PORTRAIT
  Replace this with your own background-removed photo.
  Recommended: export a transparent PNG named "portrait.png" and drop it in /images,
  then update the <img src="..."> in index.html (it already points to images/portrait.png
  with this SVG as a fallback).
-->
<svg width="600" height="820" viewBox="0 0 600 820" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placeholder portrait silhouette">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF3D1" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#E7C24B" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <!-- shoulders -->
  <path d="M70 820 C70 640 160 560 300 560 C440 560 530 640 530 820 Z" fill="url(#g)"/>
  <!-- neck -->
  <rect x="255" y="470" width="90" height="120" rx="40" fill="url(#g)"/>
  <!-- head -->
  <ellipse cx="300" cy="330" rx="150" ry="175" fill="url(#g)"/>
  <!-- simple sunglasses nod to the reference photo -->
  <rect x="200" y="300" width="80" height="42" rx="20" fill="#0A2A55" opacity="0.85"/>
  <rect x="320" y="300" width="80" height="42" rx="20" fill="#0A2A55" opacity="0.85"/>
  <rect x="280" y="314" width="40" height="10" rx="5" fill="#0A2A55" opacity="0.85"/>
</svg>
